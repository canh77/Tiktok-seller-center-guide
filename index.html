<style>
/* Layout: sticky left index of tabs grouped by job, reading column on the right; index folds into a menu on phones. */
:root {

  --accent: #0B5CAD;
  --accent-bg: #E4EFFA;
  --ops: #0B7564;
  --ops-bg: #E1F2EE;
  --traffic: #5240BF;
  --traffic-bg: #ECE8FA;
  --control: #B5401F;
  --control-bg: #FAE9E3;
  --warn: #8A5A00;
  --warn-bg: #FBF0D8;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

    --surface: #16202A;
    --ink: #E6EDF3;
    --muted: #9AA9B7;
    --line: #26333F;
    --accent: #6DB1F2;
    --accent-bg: #15304A;
    --ops: #54C7B1;
    --ops-bg: #11372F;
    --traffic: #ADA0FF;
    --traffic-bg: #262152;
    --control: #FF9C80;
    --control-bg: #48251A;
    --warn: #F2C263;
    --warn-bg: #3A2D10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151C;
  --surface: #16202A;
  --ink: #E6EDF3;
  --muted: #9AA9B7;
  --line: #26333F;
  --accent: #6DB1F2;
  --accent-bg: #15304A;
  --ops: #54C7B1;
  --ops-bg: #11372F;
  --traffic: #ADA0FF;
  --traffic-bg: #262152;
  --control: #FF9C80;
  --control-bg: #48251A;
  --warn: #F2C263;
  --warn-bg: #3A2D10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; padding-inline: 16px; padding-block: 20px 56px; }
.wrap { max-width: 1120px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
header.top h1 { font-size: clamp(1.45rem, 3.2vw, 2rem); line-height: 1.2; margin: 0; font-weight: 600; text-wrap: balance; }
header.top p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.progress { min-width: 180px; font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px; align-items: start; }
nav.index { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; padding-right: 4px; }
.menu-btn { display: none; }
#search { width: 100%; font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); margin-bottom: 12px; }
#search:focus-visible, .tab:focus-visible, .pager button:focus-visible, .menu-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grp { margin: 14px 0 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.tab { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: inherit; background: none; border: 0; border-radius: 6px; padding: 7px 10px; color: var(--ink); cursor: pointer; }
.tab:hover { background: var(--surface); }
.tab .en { font-weight: 500; display: block; line-height: 1.3; }
.tab .vi { font-size: 12.5px; color: var(--muted); display: block; line-height: 1.3; }
.tab.on { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.tab.on .en { color: var(--g, var(--accent)); }
.tab .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.tab.done .dot { background: var(--g, var(--accent)); border-color: var(--g, var(--accent)); }
main.doc { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(18px, 3.4vw, 36px); }
main.doc[data-g="ops"] { --g: var(--ops); --gbg: var(--ops-bg); }
main.doc[data-g="traffic"] { --g: var(--traffic); --gbg: var(--traffic-bg); }
main.doc[data-g="control"] { --g: var(--control); --gbg: var(--control-bg); }
main.doc[data-g="start"] { --g: var(--accent); --gbg: var(--accent-bg); }
.crumb { display: inline-block; font-family: var(--font-mono); font-size: 12px; background: var(--gbg); color: var(--g); padding: 3px 9px; border-radius: 4px; }
main.doc h2.title { font-size: clamp(1.5rem, 3.4vw, 2.1rem); line-height: 1.2; margin: 12px 0 2px; font-weight: 600; text-wrap: balance; }
.vi-title { color: var(--muted); font-size: 1.05rem; margin: 0 0 14px; }
.lead { font-size: 1.05rem; max-width: 65ch; margin: 0 0 8px; }
.blk { margin-top: 28px; }
.blk > h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--g); font-weight: 600; margin: 0 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.card b { display: block; font-weight: 600; line-height: 1.4; margin-bottom: 2px; }
.card span { color: var(--muted); font-size: 14px; display: block; }
ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 10px; }
ol.steps li { counter-increment: s; position: relative; padding-left: 38px; max-width: 70ch; }
ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--gbg); color: var(--g); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
ul.plain { margin: 0; padding-left: 20px; max-width: 70ch; }
ul.plain li { margin-bottom: 6px; }
.links a { color: var(--accent); text-underline-offset: 2px; overflow-wrap: anywhere; }
.note { border-radius: 8px; padding: 14px 16px; background: var(--gbg); }
.note.warn { background: var(--warn-bg); }
.note h3 { color: var(--g); }
.note.warn h3 { color: var(--warn); }
.note ul { margin: 0; padding-left: 20px; max-width: 70ch; }
.note li { margin-bottom: 5px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12.5px; background: var(--bg); }
tr:last-child td { border-bottom: 0; }
td.en { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; color: var(--g); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager button { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; cursor: pointer; max-width: 100%; text-align: left; }
.pager button:hover { border-color: var(--g); }
.pager small { display: block; color: var(--muted); font-size: 12px; }
.disclaimer { margin-top: 20px; font-size: 13px; color: var(--muted); max-width: 70ch; }
#gloss-search { width: 100%; max-width: 380px; font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); margin-bottom: 12px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  nav.index { position: static; max-height: none; }
  .menu-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; font: inherit; font-weight: 500; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; cursor: pointer; }
  nav.index .list { display: none; margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  nav.index.open .list { display: block; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>

<div class="wrap">

    <div>
      <h1>Seller Center cho người mới</h1>
      <p>Tài liệu tiếng Việt kèm thuật ngữ tiếng Anh cho từng mục trong TikTok Shop Seller Center US. Bấm một tab để đọc công dụng và cách dùng.</p>

    </nav>
    <main class="doc" id="doc" tabindex="-1"></main>
  </div>
</div>

    'Xác minh doanh nghiệp không đảm bảo quảng cáo luôn được duyệt. Quảng cáo vẫn phải tuân thủ chính sách.'
  ]],
  ['terms', 'Từ chuyên ngành (Key terms)', [
    ['Business verification', 'Xác minh doanh nghiệp', 'Chứng minh doanh nghiệp là thật.'],
    ['Entity type', 'Loại hình doanh nghiệp', 'Công ty, hộ kinh doanh, cá nhân và các loại khác.'],
    ['Business license', 'Giấy phép kinh doanh', 'Giấy tờ đăng ký doanh nghiệp.'],
    ['Certificate number', 'Số chứng nhận', 'Số ghi trên giấy phép.'],
    ['Verified', 'Đã xác minh', 'Hồ sơ được chấp nhận.'],

  ['links', 'Nguồn tham khảo chính thức (Official sources)', [

    ['Uploading documents for advertisers on TikTok', 'https://ads.tiktok.com/help/article/uploading-documents-for-advertisers-on-tiktok?lang=pl-PL']
  ]]
]},

{ id: 'partner', g: 'control', en: 'Partner', vi: 'Đối tác', lead: 'Danh bạ các đơn vị dịch vụ bên thứ ba mà TikTok giới thiệu, ví dụ đơn vị vận hành shop, nội dung, kho và giao hàng.', b: [
  ['cards', 'Bạn có thể tìm (What you can find)', [
    ['Operations partners (Đơn vị vận hành)', 'Hỗ trợ quản lý shop, đăng sản phẩm.'],
    ['Content partners (Đơn vị làm nội dung)', 'Hỗ trợ quay dựng video, LIVE.'],
    ['Logistics partners (Đơn vị kho, giao hàng)', 'Lưu kho và giao hàng tại Mỹ.']
  ]],
  ['ol', 'Kiểm tra trước khi thuê (Checklist before hiring)', [
    'Chỉ chọn đối tác có trong danh sách chính thức của Seller Center.',
    'Yêu cầu hợp đồng rõ ràng về công việc, phí và thời hạn.',
    'Yêu cầu báo cáo định kỳ và quyền truy cập minh bạch.',
    'Không giao mật khẩu tài khoản. Dùng cơ chế phân quyền nếu có.'
  ]],
  ['warn', 'Cảnh giác (Watch out)', [
    'Lời hứa bao lên top, bao doanh số là dấu hiệu lừa đảo phổ biến.',
    'Không ai đảm bảo được doanh số cố định cho shop.'
  ]],
  ['terms', 'Từ chuyên ngành (Key terms)', [
    ['Third-party', 'Bên thứ ba', 'Đơn vị ngoài TikTok và ngoài bạn.'],
    ['Agency', 'Công ty dịch vụ', 'Đơn vị nhận vận hành thay.'],
    ['Contract', 'Hợp đồng', 'Thỏa thuận bằng văn bản.']
  ]]
]},

{ id: 'apps', g: 'control', en: 'Apps', vi: 'Ứng dụng', lead: 'Kho ứng dụng và tích hợp để nối Seller Center với phần mềm khác. Khi đơn nhiều, công cụ giúp tiết kiệm thời gian và giảm sai sót.', b: [
  ['cards', 'Nhóm ứng dụng thường gặp (Common app types)', [
    ['Order management (Quản lý đơn)', 'Gom đơn từ nhiều kênh vào một nơi.'],
    ['Inventory sync (Đồng bộ tồn kho)', 'Tự trừ kho khi có đơn ở bất kỳ kênh nào.'],
    ['Label printing (In nhãn hàng loạt)', 'In nhiều nhãn vận chuyển cùng lúc.'],
    ['Customer service (Chăm sóc khách)', 'Quản lý tin nhắn và khiếu nại.']
  ]],
  ['tip', 'Khi nào cần (When to use)', [
    'Đơn trên khoảng vài chục mỗi ngày.',
    'Bán đồng thời nhiều nơi như TikTok Shop, Shopify, Amazon.'
  ]],
  ['warn', 'Lưu ý bảo mật (Security notes)', [
    'Chỉ cài ứng dụng có đánh giá tốt và nhà phát triển rõ ràng.',
    'Chỉ cấp quyền cần thiết và gỡ ứng dụng không còn dùng.'
  ]],
  ['terms', 'Từ chuyên ngành (Key terms)', [
    ['Integration', 'Tích hợp', 'Kết nối hai phần mềm.'],
    ['API', 'Giao diện kết nối', 'Cách phần mềm trao đổi dữ liệu.'],
    ['Permission', 'Quyền truy cập', 'Phạm vi ứng dụng được phép đọc hoặc sửa.']
  ]]

{ id: 'glossary', g: 'start', en: 'Glossary', vi: 'Từ điển thuật ngữ', lead: 'Toàn bộ thuật ngữ trong các tab, gom một chỗ. Gõ vào ô tìm để lọc theo tiếng Anh hoặc tiếng Việt.', b: [ ['gloss'] ] }
];

var GROUPS = [
  ['start', 'Bắt đầu'],
  ['ops', 'Operations (Vận hành)'],
  ['traffic', 'Traffic & sales (Kéo khách, bán hàng)'],
  ['control', 'Control (Kiểm soát)']
];

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function lsGet() { try { return JSON.parse(localStorage.getItem('sc-read') || '[]'); } catch (e) { return []; } }
function lsSet(v) { try { localStorage.setItem('sc-read', JSON.stringify(v)); } catch (e) {} }

var read = lsGet();
var current = 'start';
var tabsEl = document.getElementById('tabs');
var docEl = document.getElementById('doc');

function allTerms() {
  var seen = {}, out = [];
  DATA.forEach(function (s) {
    s.b.forEach(function (blk) {
      if (blk[0] === 'terms') {
        blk[2].forEach(function (t) {
          var k = t[0].toLowerCase();
          if (!seen[k]) { seen[k] = 1; out.push({ en: t[0], vi: t[1], d: t[2], from: s.en }); }
        });
      }
    });
  });
  out.sort(function (a, b) { return a.en.localeCompare(b.en); });
  return out;
}

function renderTabs(filter) {
  var f = (filter || '').trim().toLowerCase();
  var html = '';
  GROUPS.forEach(function (g) {
    var items = DATA.filter(function (s) {
      if (s.g !== g[0]) return false;
      if (!f) return true;
      return (s.en + ' ' + s.vi).toLowerCase().indexOf(f) !== -1;
    });
    if (!items.length) return;
    html += '<div class="grp">' + esc(g[1]) + '</div>';
    items.forEach(function (s) {
      var color = s.g === 'start' ? 'var(--accent)' : 'var(--' + s.g + ')';
      html += '<button class="tab' + (s.id === current ? ' on' : '') + (read.indexOf(s.id) !== -1 ? ' done' : '') + '" data-id="' + s.id + '" style="--g:' + color + '"' + (s.id === current ? ' aria-current="page"' : '') + '>' +
        '<span><span class="en">' + esc(s.en) + '</span><span class="vi">' + esc(s.vi) + '</span></span><span class="dot" aria-hidden="true"></span></button>';
    });
  });
  tabsEl.innerHTML = html || '<p style="color:var(--muted);font-size:14px">Không tìm thấy mục phù hợp.</p>';
}

function renderBlock(blk) {
  var kind = blk[0], h = blk[1], items = blk[2];
  if (kind === 'cards') {
    return '<section class="blk"><h3>' + esc(h) + '</h3><div class="cards">' + items.map(function (c) {
      return '<div class="card"><b>' + esc(c[0]) + '</b><span>' + esc(c[1]) + '</span></div>';
    }).join('') + '</div></section>';
  }
  if (kind === 'ol') {
    return '<section class="blk"><h3>' + esc(h) + '</h3><ol class="steps">' + items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ol></section>';
  }
  if (kind === 'tip' || kind === 'warn') {
    return '<section class="blk note ' + kind + '"><h3>' + esc(h) + '</h3><ul>' + items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></section>';
  }
  if (kind === 'terms') {
    return '<section class="blk"><h3>' + esc(h) + '</h3><div class="tablewrap"><table><thead><tr><th>English</th><th>Tiếng Việt</th><th>Ý nghĩa</th></tr></thead><tbody>' +
      items.map(function (t) { return '<tr><td class="en">' + esc(t[0]) + '</td><td>' + esc(t[1]) + '</td><td>' + esc(t[2]) + '</td></tr>'; }).join('') +
      '</tbody></table></div></section>';
  }
  if (kind === 'links') {
    return '<section class="blk"><h3>' + esc(h) + '</h3><ul class="plain links">' + items.map(function (l) {
      return '<li><a href="' + esc(l[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(l[0]) + '</a></li>';
    }).join('') + '</ul></section>';
  }
  if (kind === 'gloss') {
    return '<section class="blk"><input id="gloss-search" type="search" placeholder="Tìm thuật ngữ (ví dụ: voucher, hoa hồng)" aria-label="Tìm thuật ngữ"><div class="tablewrap"><table><thead><tr><th>English</th><th>Tiếng Việt</th><th>Ý nghĩa</th><th>Mục</th></tr></thead><tbody id="gloss-body"></tbody></table></div></section>';
  }
  return '';
}

function fillGloss(q) {
  var f = (q || '').trim().toLowerCase();
  var rows = allTerms().filter(function (t) { return !f || (t.en + ' ' + t.vi + ' ' + t.d).toLowerCase().indexOf(f) !== -1; });
  document.getElementById('gloss-body').innerHTML = rows.length ? rows.map(function (t) {
    return '<tr><td class="en">' + esc(t.en) + '</td><td>' + esc(t.vi) + '</td><td>' + esc(t.d) + '</td><td>' + esc(t.from) + '</td></tr>';
  }).join('') : '<tr><td colspan="4">Không có thuật ngữ phù hợp.</td></tr>';
}

function updateProgress() {
  var total = DATA.length;
  var n = DATA.filter(function (s) { return read.indexOf(s.id) !== -1; }).length;
  document.getElementById('prog-text').textContent = 'Đã đọc ' + n + '/' + total + ' mục';
  document.getElementById('prog-bar').style.width = (n / total * 100) + '%';
}

function show(id, opts) {
  var idx = DATA.findIndex(function (s) { return s.id === id; });
  if (idx < 0) { idx = 0; id = DATA[0].id; }
  var s = DATA[idx];
  current = id;
  if (read.indexOf(id) === -1) { read.push(id); lsSet(read); }
  docEl.setAttribute('data-g', s.g);
  var prev = DATA[idx - 1], next = DATA[idx + 1];
  var groupName = (GROUPS.filter(function (g) { return g[0] === s.g; })[0] || [])[1] || '';
  docEl.innerHTML =
    '<span class="crumb">' + esc(groupName) + '</span>' +
    '<h2 class="title">' + esc(s.en) + '</h2>' +
    '<p class="vi-title">' + esc(s.vi) + '</p>' +
    '<p class="lead">' + esc(s.lead) + '</p>' +
    s.b.map(renderBlock).join('') +
    '<div class="pager">' +
      (prev ? '<button data-go="' + prev.id + '"><small>Mục trước</small>' + esc(prev.en) + ' (' + esc(prev.vi) + ')</button>' : '<span></span>') +
      (next ? '<button data-go="' + next.id + '"><small>Mục tiếp theo</small>' + esc(next.en) + ' (' + esc(next.vi) + ')</button>' : '<span></span>') +
    '</div>' +
    '<p class="disclaimer">Tài liệu tự biên soạn để học, không phải tài liệu chính thức của TikTok. Tên mục, phí, ngưỡng điểm và chính sách có thể thay đổi. Hãy đối chiếu với Policy và Academy trong Seller Center trước khi áp dụng.</p>';
  if (s.id === 'glossary') {
    fillGloss('');
    document.getElementById('gloss-search').addEventListener('input', function (e) { fillGloss(e.target.value); });
  }
  document.getElementById('menu-label').textContent = s.en + ' (' + s.vi + ')';
  renderTabs(document.getElementById('search').value);
  updateProgress();
  if (!opts || !opts.silent) {
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    window.scrollTo({ top: 0 });
  }
  document.getElementById('index').classList.remove('open');
  document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
}

tabsEl.addEventListener('click', function (e) {
  var b = e.target.closest('.tab');
  if (b) show(b.getAttribute('data-id'));
});
docEl.addEventListener('click', function (e) {
  var b = e.target.closest('[data-go]');
  if (b) show(b.getAttribute('data-go'));
});
document.getElementById('search').addEventListener('input', function (e) { renderTabs(e.target.value); });
document.getElementById('menu-btn').addEventListener('click', function () {
  var nav = document.getElementById('index');
  var open = nav.classList.toggle('open');
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
});
window.addEventListener('hashchange', function () {
  var id = location.hash.replace('#', '');
  if (id && id !== current) show(id, { silent: true });
});

show(location.hash.replace('#', '') || 'start', { silent: true });
</script>

</body>
</html>
